    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "PingFang SC", "Microsoft JhengHei", sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .bg-slideshow {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            animation: fade 16s infinite;
        }

        .bg-1 {
            background-image: url('background1.jpg');
            animation-delay: 0s;
        }

        .bg-2 {
            background-image: url('background2.jpg');
            animation-delay: 8s;
        }

        @keyframes fade {
            0%, 45% { opacity: 0; }
            5%, 40% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            z-index: 0;
        }

        .content {
            position: relative;
            z-index: 1;
            text-align: center;
            color: #fff;
            max-width: 600px;
            padding: 40px;
            background: rgba(43, 27, 78, 0.75);
            border-radius: 16px;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }

        .title {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 12px;
            color: #ffd700;
        }

        .subtitle {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .desc {
            font-size: 16px;
            margin-bottom: 40px;
            opacity: 0.9;
            line-height: 1.6;
        }

        .cta-button {
            background-color: #f7d774;
            color: #2c221c;
            border: none;
            padding: 16px 32px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .cta-button:hover {
            background-color: #e6c65c;
            transform: scale(1.05);
        }
    </style>
</head>
